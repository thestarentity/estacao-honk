# Actions
- type: entity
  parent: BaseAction
  id: ActionJumpToCore
  name: Jump to core
  description: Sends your eye back to the core.
  components:
  - type: Action
    priority: -9
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: ai_core
  - type: InstantAction
    event: !type:JumpToCoreEvent

# Concedida ao borg enquanto a IA o pilota (Fase 5A). Devolve a mente da IA ao núcleo.
- type: entity
  parent: BaseAction
  id: ActionStationAiLeaveBorg
  name: Voltar ao núcleo
  description: Devolve sua mente ao núcleo da IA, largando este borg.
  components:
  - type: Action
    priority: -10
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_ai_custom.rsi
      state: aicontrol_disable
  - type: InstantAction
    event: !type:StationAiLeaveBorgEvent

- type: entity
  parent: BaseMentalAction
  id: ActionAIViewLaws
  name: View Laws
  description: View the laws that you must follow.
  components:
  - type: Action
    priority: -3
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: state_laws
    useDelay: 0.5
  - type: InstantAction
    event: !type:ToggleLawsScreenEvent
