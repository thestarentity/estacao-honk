# Avisa o canal #githook do Discord a cada push (ver Tools/githook_discord.py).
# O segredo DISCORD_GITHOOK_WEBHOOK (a URL do webhook do canal) fica em
# Settings > Secrets and variables > Actions do repositorio. Sem ele, o passo sai
# em silencio: forks de terceiros nao tem o segredo, e tudo bem.
name: githook para o Discord

on:
  push:

jobs:
  avisar:
    runs-on: ubuntu-latest
    # nao roda em fork de quem abre PR (nao tem o segredo, e evita barulho)
    if: github.repository_owner == 'thestarentity'
    steps:
      - uses: actions/checkout@v4
      - name: Avisar o Discord
        env:
          DISCORD_GITHOOK_WEBHOOK: ${{ secrets.DISCORD_GITHOOK_WEBHOOK }}
        run: python3 Tools/githook_discord.py
